<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TACBO Finance & Farm - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f8f5, #e8f0eb);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #17231b;
    }

    .login-box {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px 35px;
      border-radius: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      text-align: center;
    }

    .logo {
      font-size: 58px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      color: #10251a;
    }

    .subtitle {
      color: #68756e;
      font-size: 19px;
      margin: 15px 0 35px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 19px;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 19px;
      border: 3px solid #dce5df;
      border-radius: 20px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #1d7a3d;
    }

    button {
      width: 100%;
      border: 0;
      padding: 19px;
      margin-top: 18px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn {
      background: #1d7a3d;
      color: white;
    }

    .google-btn {
      background: #4285f4;
      color: white;
    }

    .forgot-btn {
      background: #edf2ef;
      color: #176b35;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      display: none;
      font-weight: bold;
    }

    .error {
      background: #ffe1e1;
      color: #b00000;
    }

    .success {
      background: #ddf5e4;
      color: #176b35;
    }

    @media(max-width:500px) {
      .login-box {
        padding: 30px 22px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">🌾</div>

  <h1>TACBO Finance & Farm</h1>

  <div class="subtitle">
    🔐 Fadlan gal akoontaaaga
  </div>

  <label>Email</label>
  <input
    id="email"
    type="email"
    placeholder="example@email.com"
    autocomplete="email"
  >

  <label>Password</label>
  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button class="login-btn" onclick="login()">
    🔐 Login
  </button>

  <button class="google-btn" onclick="googleLogin()">
    🌐 Ku gal Google
  </button>

  <button class="forgot-btn" onclick="forgotPassword()">
    🔑 Forgot Password
  </button>

  <div id="message"></div>

</div>

<script>

  /* ================================
     SUPABASE CONFIG
     ================================ */

  const SUPABASE_URL = "https://ujkjdxytceqfcngdzlqt.supabase.co";
  const SUPABASE_ANON_KEY = "GELI_SUPABASE_ANON_KEY_HALKAN";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ================================
     MESSAGE
     ================================ */

  function showMessage(text, type) {

    const box = document.getElementById("message");

    box.innerText = text;
    box.className = type;
    box.style.display = "block";
  }


  /* ================================
     LOGIN
     ================================ */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "❌ Fadlan geli Email iyo Password.",
        "error"
      );

      return;
    }

    showMessage(
      "⏳ Fadlan sug...",
      "success"
    );

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        "❌ " + error.message,
        "error"
      );

      return;
    }

    showMessage(
      "✅ Login waa lagu guuleystay!",
      "success"
    );

    setTimeout(() => {
      window.location.href = "index.html";
    }, 800);
  }


  /* ================================
     GOOGLE LOGIN
     ================================ */

  async function googleLogin() {

    const { error } =
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo:
            window.location.origin + "/index.html"
        }
      });

    if (error) {

      showMessage(
        "❌ " + error.message,
        "error"
      );
    }
  }


  /* ================================
     FORGOT PASSWORD
     ================================ */

  async function forgotPassword() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      showMessage(
        "❌ Marka hore geli Email-kaaga.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin + "/index.html"
        }
      );

    if (error) {

      showMessage(
        "❌ " + error.message,
        "error"
      );

      return;
    }

    showMessage(
      "✅ Link-ga Password-ka waxaa lagu diray Email-kaaga.",
      "success"
    );
  }

</script>

</body>
</html>
