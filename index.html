<style>
:root{
--g:#16803c;--g2:#22a653;--bg:#f4f8f5;--card:#fff;

--red:#c93636;--blue:#246bdb;--gold:#d68a00;

*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;min-height:100vh}
header{
position:sticky;top:0;z-index:20;background:rgba(244,248,245,.95);
backdrop-filter:blur(15px);border-bottom:1px solid var(--line)
}
.top{
display:flex;align-items:center;justify-content:space-between;
padding:16px 18px
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
width:60px;height:60px;border-radius:20px;
background:linear-gradient(135deg,#27b55a,#087532);
display:grid;place-items:center;font-size:31px
}
.brand h1{margin:0;font-size:25px}
.brand p{margin:3px 0;color:var(--muted)}
.actions{display:flex;gap:8px}
.icon{
width:47px;height:47px;border-radius:15px;
background:var(--card);border:1px solid var(--line);font-size:22px
}
nav{
display:flex;gap:8px;overflow-x:auto;padding:0 12px 13px
}
nav button{
white-space:nowrap;padding:12px 16px;border-radius:16px;
border:1px solid var(--line);background:var(--card);
color:var(--g);font-weight:800
}
nav button.active{background:var(--g);color:white}
main{padding:20px}
.status{
padding:17px 19px;border-radius:20px;background:#eafff0;
border:1px solid #b9eac9;color:#286d40;font-weight:750;
margin-bottom:20px
}
.grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:14px
}
.card{
background:var(--card);border:1px solid var(--line);
border-radius:22px;padding:19px;
box-shadow:0 8px 25px rgba(20,70,35,.07)
}
.stat .label{color:var(--muted)}
.stat .value{font-size:29px;font-weight:850;margin-top:8px}
.head{
display:flex;justify-content:space-between;align-items:center;
gap:12px;margin:20px 0 14px
}
.head h2{margin:0;font-size:26px}
.primary{
background:var(--g);color:#fff;border:0;
padding:13px 17px;border-radius:14px;font-weight:800
}
.secondary{
background:#e9f7ed;color:var(--g);border:0;
padding:10px 13px;border-radius:12px;font-weight:750
}
.danger{
background:#fff0f0;color:var(--red);border:0;
padding:10px 13px;border-radius:12px;font-weight:750
}
.search{
width:100%;padding:15px;border-radius:16px;
border:1px solid var(--line);background:white;
outline:0;margin-bottom:13px
}
.table{
overflow:auto;background:var(--card);
border:1px solid var(--line);border-radius:20px
}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line)}
th{font-size:14px;color:var(--muted);background:#fafcfb}
.empty{text-align:center;padding:45px;color:var(--muted)}
.modal{
display:none;position:fixed;inset:0;background:#0008;
z-index:100;align-items:center;justify-content:center;padding:16px
}
.modal.show{display:flex}
.box{
background:white;width:min(720px,100%);max-height:90vh;
overflow:auto;border-radius:25px;padding:21px
}
.mhead{
display:flex;justify-content:space-between;align-items:center
}
.mhead h2{margin:0}
.close{
width:42px;height:42px;border:0;border-radius:12px;
background:#edf2ee;font-size:23px
}
.form{
display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-weight:750;color:#536158}
.field input,.field select,.field textarea{
padding:13px;border:1px solid var(--line);
border-radius:13px;outline:0;background:white
}
.field textarea{min-height:95px}
.formbuttons{
display:flex;justify-content:flex-end;gap:9px;margin-top:18px
}
footer{text-align:center;padding:35px;color:var(--muted)}

body.dark{
--bg:#0d1510;--card:#142019;--text:#eef7f0;
--muted:#a9b7ad;--line:#294034
}
body.dark header{background:#0d1510ee}
body.dark .search,
body.dark .field input,
body.dark .field select,
body.dark .field textarea{background:#101a14;color:white}
body.dark th{background:#18251d}

@media(max-width:800px){
.grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
main{padding:14px}
.top{padding:13px}
.brand h1{font-size:21px}
.brand p{font-size:13px}
.form{grid-template-columns:1fr}
.field.full{grid-column:auto}
.head h2{font-size:23px}
}
</style>
</head>

/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function cloneEmpty(){
return JSON.parse(JSON.stringify(emptyData));
}


function normalize(obj){

const base=cloneEmpty();

if(obj){

Object.keys(base).forEach(k=>{

if(Array.isArray(obj[k]))
base[k]=obj[k];

});

}

return base;
}


function loadLocal(){

try{

const raw=localStorage.getItem(LOCAL_KEY);

return normalize(
raw?JSON.parse(raw):emptyData
);

}catch(e){

return cloneEmpty();

}

}


function saveLocal(){

try{

localStorage.setItem(
LOCAL_KEY,
JSON.stringify(data)
);

}catch(e){

console.error(e);

}

}


/* =========================================================
   HELPERS
   ========================================================= */

function uid(){

return "id_"+Date.now()+"_"+Math.random()
.toString(36).slice(2,9);

}


function today(){

return new Date().toISOString().slice(0,10);

}


function money(v){

return (Number(v)||0).toLocaleString(
"en-US",
{
minimumFractionDigits:0,
maximumFractionDigits:2
}
)+" USD";

}


function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function sum(key,field){

return (data[key]||[]).reduce(
(a,x)=>a+(Number(x[field])||0),
0
);

}


/* =========================================================
   SUPABASE
   ========================================================= */

async function supabaseGet(){

const url=
SUPABASE_URL+
"/rest/v1/tacbo_records?id=eq."+
encodeURIComponent(RECORD_ID)+
"&select=*";

const r=await fetch(url,{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

if(!r.ok)
throw new Error("Supabase "+r.status);

const rows=await r.json();

return rows[0]||null;

}


async function saveToSupabase(){

try{

const r=await fetch(
SUPABASE_URL+"/rest/v1/tacbo_records",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":
"resolution=merge-duplicates,return=minimal"
},
body:JSON.stringify({
id:RECORD_ID,
data:data
})
}
);

if(!r.ok)
throw new Error("SAVE "+r.status);

document.getElementById("status").textContent=
"✅ Xogta waa la kaydiyey — telefoonka iyo Supabase.";

return true;

}catch(e){

console.error(e);

document.getElementById("status").textContent=
"⚠️ Xogta telefoonka ayaa la kaydiyey — Supabase lama xiriirin.";

return false;

}

}


async function loadFromSupabase(){

try{

const row=await supabaseGet();

if(row&&row.data){

data=normalize(row.data);
saveLocal();

}

document.getElementById("status").textContent=
"✅ Supabase waa ku xiran yahay — xogta waa la kaydin karaa.";

}catch(e){

console.warn(e);

document.getElementById("status").textContent=
"⚠️ Xogta telefoonka ayaa diyaar ah.";

}

render();

}

function formatCell(field,value){

if(
field==="amount"||
field==="value"||
field==="salary"
)
return money(value);

if(
value===undefined||
value===null||
value===""
)
return "—";

return esc(value);

}

obj[f[0]]=el.value;

if(f[2]==="number")
obj[f[0]]=Number(el.value)||0;

});


if(id){

const index=data[key]
.findIndex(x=>x.id===id);

if(index>=0)
data[key][index]=obj;

}else{

data[key].unshift(obj);

}

saveLocal();

closeModal();

render();

document.getElementById("status").textContent=
"💾 Xogta waa la kaydiyey.";

await saveToSupabase();

};

}


function fieldHTML(name,label,type,value){

const v=
value ??
(name==="date"?today():"");

if(type==="textarea"){

return `

<div class="field full">

<label>${label}</label>

<textarea
id="f_${name}">${esc(v)}</textarea>

</div>

`;

}


if(type.startsWith("select:")){

const options=
type.slice(7).split(",");

return `

<div class="field">

<label>${label}</label>

<select id="f_${name}">

${options.map(o=>`

<option
value="${esc(o)}"
${String(v)===o?"selected":""}>
${esc(o)}
</option>

`).join("")}

</select>

</div>

`;

}


return `

<div class="field">

<label>${label}</label>

<input
id="f_${name}"
type="${type}"
value="${esc(v)}"
${type==="number"?'step="any"':""}>

</div>

`;

}


/* =========================================================
   DELETE
   ========================================================= */

async function removeItem(key,id){

const row=(data[key]||[])
.find(x=>x.id===id);

const name=
row?.name||
row?.description||
row?.animalId||
row?.person||
"xogtan";

if(!confirm(
"Ma hubtaa inaad tirtirayso "+name+"?"
))
return;

data[key]=(data[key]||[])
.filter(x=>x.id!==id);

saveLocal();

render();

document.getElementById("status").textContent=
"🗑️ Xogta waa la tirtiray.";

await saveToSupabase();

}

function render(){

renderNav();

const view=document.getElementById("view");

view.innerHTML=
currentModule==="dashboard"
?dashboard()
:moduleView(currentModule);


view.querySelectorAll("[data-add]")
.forEach(btn=>{

openForm(btn.dataset.add);
};

});

.forEach(btn=>{

btn.onclick=()=>{

const [key,id]=
btn.dataset.edit.split("|");

};

});


view.querySelectorAll("[data-delete]")
.forEach(btn=>{

btn.onclick=()=>{

const [key,id]=
btn.dataset.delete.split("|");

removeItem(key,id);

};

});


view.querySelectorAll("[data-quick]")
.forEach(btn=>{

btn.onclick=()=>{
openForm(btn.dataset.quick);
};

});


const search=
document.getElementById("searchInput");

if(search){

search.oninput=()=>{

searchText=search.value;

render();

const n=
document.getElementById("searchInput");

if(n){

n.focus();

n.setSelectionRange(
searchText.length,
searchText.length
);

}

};

}

}


/* =========================================================
   MODAL
   ========================================================= */

function closeModal(){

document.getElementById("modal")
.classList.remove("show");

}


document.getElementById("close")
.onclick=closeModal;


document.getElementById("modal")
.onclick=e=>{

if(e.target.id==="modal")
closeModal();

};


/* =========================================================
   DARK / LIGHT
   ========================================================= */

const savedTheme=
localStorage.getItem("tacbo_theme");

if(savedTheme==="dark"){

document.body.classList.add("dark");

document.getElementById("theme")
.textContent="☀️";

}


document.getElementById("theme")
.onclick=()=>{

document.body.classList.toggle("dark");

const dark=
document.body.classList.contains("dark");

localStorage.setItem(
"tacbo_theme",
dark?"dark":"light"
);

document.getElementById("theme")
.textContent=
dark?"☀️":"🌙";

};
