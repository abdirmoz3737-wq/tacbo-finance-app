<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b45">
<title>TACBO Agro Finance</title>

<style>
:root {
  --green: #176b45;
  --dark: #10452f;
  --light: #f3f7f4;
  --white: #ffffff;
  --red: #bd2d2d;
  --orange: #e78a20;
  --blue: #226bc0;
  --border: #dce5df;
  --text: #26352c;
  --muted: #65756a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--light);
  color: var(--text);
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 7px;
  padding: 10px 13px;
}

header {
  background: var(--green);
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

header h1 {
  font-size: 22px;
  margin: 0;
}

header p {
  margin: 5px 0 0;
  font-size: 12px;
}

.layout {
  display: flex;
  min-height: calc(100vh - 75px);
}

.sidebar {
  width: 225px;
  flex-shrink: 0;
  background: var(--dark);
  padding: 12px;
}

.sidebar button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: white;
  margin: 3px 0;
  padding: 11px;
}

.sidebar button:hover,
.sidebar button.active {
  background: var(--green);
}

main {
  flex: 1;
  min-width: 0;
  padding: 22px;
}

.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.page-heading h2 {
  margin: 0 0 5px;
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.card, .panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 5px #00000008;
}

.card h3 {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 10px;
}

.number {
  font-weight: bold;
  font-size: 22px;
  overflow-wrap: anywhere;
}

.green { color: var(--green); }
.red { color: var(--red); }
.blue { color: var(--blue); }

.panel {
  margin-bottom: 18px;
}

.panel h3 {
  margin: 0 0 14px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(140px, 1fr));
  gap: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 12px;
  font-weight: bold;
}

.field input,
.field select,
.field textarea,
.search {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd8ce;
  border-radius: 7px;
  background: white;
  color: var(--text);
}

.field textarea {
  min-height: 72px;
  resize: vertical;
}

.actions,
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.toolbar {
  margin: 0 0 14px;
}

.search {
  max-width: 340px;
}

.primary {
  background: var(--green);
  color: white;
}

.secondary {
  background: #e6eee8;
  color: var(--dark);
}

.danger {
  background: var(--red);
  color: white;
}

.warning {
  background: var(--orange);
  color: white;
}

.small {
  padding: 6px 8px;
  font-size: 12px;
  margin: 2px;
}

.table-wrap {
  width: 100%;
  overflow: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 650px;
  background: white;
}

th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid #e4ebe5;
  font-size: 12px;
  vertical-align: top;
}

th {
  background: #edf4ef;
  position: sticky;
  top: 0;
}

tr:hover td {
  background: #f8fbf8;
}

.empty {
  padding: 24px;
  text-align: center;
  color: var(--muted);
}

.notice {
  display: none;
  padding: 12px;
  border-radius: 7px;
  background: #e7f4eb;
  margin-bottom: 14px;
}

.notice.error {
  background: #ffebeb;
  color: #8d1b1b;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 18px;
}

@media(max-width:950px) {
  .cards {
    grid-template-columns: repeat(2, minmax(130px, 1fr));
  }

  .form-grid {
    grid-template-columns: repeat(2, minmax(130px, 1fr));
  }
}

@media(max-width:620px) {
  header {
    padding: 13px;
  }

  header h1 {
    font-size: 18px;
  }

  .layout {
    display: block;
  }

  .sidebar {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px;
  }

  .sidebar button {
    font-size: 12px;
    margin: 0;
    padding: 10px 7px;
  }

  main {
    padding: 12px;
  }

  .cards {
    gap: 8px;
  }

  .card {
    padding: 12px;
  }

  .number {
    font-size: 18px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .panel {
    padding: 12px;
  }

  .search {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>🌾 TACBO Agro Finance</h1>
    <p>Agriculture & Livestock Management System</p>
  </div>

  <div class="actions" style="margin:0">
    <button class="secondary" onclick="backupData()">💾 Backup</button>
    <button class="secondary"
      onclick="document.getElementById('restoreFile').click()">
      📂 Restore
    </button>
    <button class="secondary" onclick="exportAllCSV()">
      📄 Export CSV
    </button>

    <input
      id="restoreFile"
      type="file"
      accept=".json,application/json"
      hidden
      onchange="restoreData(event)"
    >
  </div>
</header>

<div class="layout">

<nav class="sidebar" id="navigation">
  <button class="active" onclick="openPage('dashboard',this)">📊 Dashboard</button>
  <button onclick="openPage('finance',this)">💰 Dhaqaale</button>
  <button onclick="openPage('livestock',this)">🐑 Xoolaha</button>
  <button onclick="openPage('crops',this)">🌱 Beeraha</button>
  <button onclick="openPage('milk',this)">🥛 Caanaha</button>
  <button onclick="openPage('assets',this)">🏠 Hantida</button>
  <button onclick="openPage('equipment',this)">🚜 Mashiinnada</button>
  <button onclick="openPage('irrigation',this)">💧 Waraabka</button>
  <button onclick="openPage('feed',this)">🌾 Calafka</button>
  <button onclick="openPage('employees',this)">👷 Shaqaalaha</button>
  <button onclick="openPage('debts',this)">📒 Deymaha</button>
  <button onclick="openPage('calculator',this)">🧮 Calculator</button>
  <button onclick="openPage('reports',this)">📈 Warbixinno</button>
  <button onclick="openPage('settings',this)">⚙️ Dejinta</button>
</nav>

<main>
  <div id="notice" class="notice" role="status"></div>
  <div id="content"></div>
</main>

</div>

<footer>
  TACBO Agro Agriculture & Livestock Company ·
  Xogta waxaa lagu kaydiyaa browser-ka qalabkaaga.
</footer>

<script>
"use strict";

const STORE_KEY = "tacbo_agro_finance_v1";

const MODULES = {
  finance: {
    title: "Dhaqaale",
    singular: "Dhaqaale",
    fields: [
      ["date","Taariikh","date"],
      ["type","Nooc","select:Income,Dakhli;Expense,Kharash;Sale,Iib;Other,Kale"],
      ["category","Qaybta","text"],
      ["amount","Lacag ($)","number"],
      ["method","Habka lacagta","select:Cash,Lacag caddaan;Bank,Bangi;Mobile,Mobile money;Other,Kale"],
      ["person","Qof/Shirkad","text"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  livestock: {
    title: "Xoolaha",
    singular: "Xoolo",
    fields: [
      ["date","Taariikh","date"],
      ["animalType","Nooca","select:Sheep,Ari;Goat,Riyo;Cattle,Lo';Camel,Geel;Other,Kale"],
      ["tag","ID/Sumad","text"],
      ["count","Tirada","number"],
      ["status","Xaalad","select:Alive,Nool;Sold,Iibiyey;Dead,Dhimasho;Born,Dhashay"],
      ["purchasePrice","Qiimaha iibka ($)","number"],
      ["salePrice","Qiimaha la iibiyey ($)","number"],
      ["location","Goob","text"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  crops: {
    title: "Beeraha & Dalagyada",
    singular: "Dalag",
    fields: [
      ["date","Taariikh","date"],
      ["farm","Magaca beerta","text"],
      ["crop","Dalagga","text"],
      ["area","Baaxadda (hektar)","number"],
      ["stage","Marxaladda","select:Planned,Qorshe;Planted,La beeray;Growing,Koraya;Harvested,La goostay"],
      ["quantity","Wax-soo-saar (kg)","number"],
      ["cost","Kharash ($)","number"],
      ["revenue","Dakhli ($)","number"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  milk: {
    title: "Caanaha",
    singular: "Diiwaan caano",
    fields: [
      ["date","Taariikh","date"],
      ["animal","Xoolaha","select:Cow,Lo';Camel,Geel;Goat,Riyo;Sheep,Ari"],
      ["litres","Litir","number"],
      ["price","Qiimaha litir ($)","number"],
      ["sold","La iibiyey (litir)","number"],
      ["cost","Kharash ($)","number"],
      ["buyer","Iibsade","text"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  assets: {
    title: "Hantida",
    singular: "Hanti",
    fields: [
      ["date","Taariikh","date"],
      ["name","Magaca hantida","text"],
      ["category","Qaybta","select:Land,Dhul;Building,Dhismaha;Well,Ceel;Vehicle,Gaari;Equipment,Qalab;Other,Kale"],
      ["quantity","Tirada","number"],
      ["value","Qiimaha ($)","number"],
      ["location","Goobta","text"],
      ["condition","Xaalad","select:Good,Wanaagsan;Needs repair,Dayactir u baahan;Broken,Jaban"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  equipment: {
    title: "Mashiinnada & Qalabka",
    singular: "Qalab",
    fields: [
      ["date","Taariikh","date"],
      ["name","Magaca mashiinka","text"],
      ["category","Nooca","select:Tractor,Cagaf;Pump,Matoor;Vehicle,Gaari;Tool,Qalab;Other,Kale"],
      ["serial","ID/Serial","text"],
      ["hours","Saacadaha shaqada","number"],
      ["fuel","Shidaal (litir)","number"],
      ["maintenance","Dayactirka xiga","date"],
      ["cost","Qiimaha ($)","number"],
      ["status","Xaalad","select:Working,Shaqaynaya;Repair,Dayactir;Inactive,Hakad"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  irrigation: {
    title: "Waraabka & Ceelasha",
    singular: "Diiwaan waraab",
    fields: [
      ["date","Taariikh","date"],
      ["farm","Beerta","text"],
      ["source","Isha biyaha","select:Well,Ceel;River,Webi;Tank,Haamo;Other,Kale"],
      ["pump","Matoor/HP","text"],
      ["hours","Saacadaha shaqada","number"],
      ["fuel","Shidaal (litir)","number"],
      ["cost","Kharash ($)","number"],
      ["area","Baaxadda la waraabiyey (ha)","number"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  feed: {
    title: "Calafka Xoolaha",
    singular: "Diiwaan calaf",
    fields: [
      ["date","Taariikh","date"],
      ["name","Magaca calafka","text"],
      ["category","Nooca","select:Hay,Caws qalalan;Silage,Silage;Grain,Hadhuudh;Concentrate,Quudin isku-dar;Other,Kale"],
      ["quantity","Tirada (kg)","number"],
      ["unitCost","Qiimaha/kg ($)","number"],
      ["used","La isticmaalay (kg)","number"],
      ["supplier","Iibiyaha","text"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  employees: {
    title: "Shaqaalaha",
    singular: "Shaqaale",
    fields: [
      ["date","Taariikhda shaqaaleysiinta","date"],
      ["name","Magaca","text"],
      ["role","Shaqada","text"],
      ["phone","Telefoon","tel"],
      ["salary","Mushahar ($)","number"],
      ["status","Xaalad","select:Active,Shaqaynaya;Inactive,Hakad;Left,Ka tagay"],
      ["paid","Mushahar la bixiyey ($)","number"],
      ["notes","Faahfaahin","textarea"]
    ]
  },

  debts: {
    title: "Deymaha",
    singular: "Deyn",
    fields: [
      ["date","Taariikh","date"],
      ["person","Qofka/Shirkadda","text"],
      ["type","Nooca","select:Owed to us,Lagu leeyahay;We owe,Annaga lagu leeyahay"],
      ["amount","Wadarta deynta ($)","number"],
      ["paid","Lacag la bixiyey ($)","number"],
      ["dueDate","Taariikhda bixinta","date"],
      ["status","Xaalad","select:Open,Furan;Paid,Bixiyey;Partially paid,Qayb laga bixiyey"],
      ["notes","Faahfaahin","textarea"]
    ]
  }
};<script>
/* =====================================================
   TACBO AGRO FINANCE — PART 2
   Kaydinta xogta iyo habaynta Dashboard-ka
===================================================== */

let db = loadDatabase();
let currentPage = "dashboard";
let editingRecord = null;
let searchText = "";

function loadDatabase() {
  try {
    const saved = localStorage.getItem(STORE_KEY);

    if (saved) {
      const parsed = JSON.parse(saved);

      if (parsed && typeof parsed === "object") {
        if (!parsed.records) parsed.records = {};
        if (!parsed.settings) parsed.settings = {};

        Object.keys(MODULES).forEach(key => {
          if (!Array.isArray(parsed.records[key])) {
            parsed.records[key] = [];
          }
        });

        return parsed;
      }
    }
  } catch (error) {
    console.error("Xogta lama akhrin:", error);
  }

  const records = {};

  Object.keys(MODULES).forEach(key => {
    records[key] = [];
  });

  return {
    version: 1,
    records,
    settings: {
      company: "TACBO Agro Agriculture & Livestock Company",
      currency: "USD",
      language: "so"
    }
  };
}

function saveDatabase() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
    return true;
  } catch (error) {
    showNotice(
      "Xogta lama kaydin. Hubi booska browser-ka.",
      true
    );

    console.error(error);
    return false;
  }
}

function getRecords(moduleKey) {
  if (!db.records[moduleKey]) {
    db.records[moduleKey] = [];
  }

  return db.records[moduleKey];
}

function makeId() {
  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9)
  );
}

function today() {
  const date = new Date();

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function number(value) {
  const result = Number(value);

  return Number.isFinite(result) ? result : 0;
}

function money(value) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 2
  }).format(number(value));
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showNotice(message, error = false) {
  const box = document.getElementById("notice");

  box.textContent = message;
  box.className = error ? "notice error" : "notice";
  box.style.display = "block";

  window.clearTimeout(showNotice.timer);

  showNotice.timer = window.setTimeout(() => {
    box.style.display = "none";
  }, 3500);
}

function openPage(page, button) {
  currentPage = page;
  editingRecord = null;
  searchText = "";

  document.querySelectorAll(".sidebar button").forEach(item => {
    item.classList.remove("active");
  });

  if (button) {
    button.classList.add("active");
  } else {
    document.querySelectorAll(".sidebar button").forEach(item => {
      const handler = item.getAttribute("onclick") || "";

      if (handler.includes("'" + page + "'")) {
        item.classList.add("active");
      }
    });
  }

  renderPage();
}

function renderPage() {
  const container = document.getElementById("content");

  if (currentPage === "dashboard") {
    renderDashboard(container);
    return;
  }

  if (currentPage === "calculator") {
    renderCalculator(container);
    return;
  }

  if (currentPage === "reports") {
    renderReports(container);
    return;
  }

  if (currentPage === "settings") {
    renderSettings(container);
    return;
  }

  if (MODULES[currentPage]) {
    renderModule(currentPage, container);
    return;
  }

  container.innerHTML = `
    <div class="panel">
      <h2>Qaybtan lama helin</h2>
      <button class="primary" onclick="openPage('dashboard')">
        Dashboard
      </button>
    </div>
  `;
}

/* =====================================================
   DASHBOARD
===================================================== */

function calculateFinance() {
  const records = getRecords("finance");

  let income = 0;
  let expenses = 0;
  let sales = 0;

  records.forEach(record => {
    const amount = number(record.amount);

    if (record.type === "Income") {
      income += amount;
    }

    if (record.type === "Expense") {
      expenses += amount;
    }

    if (record.type === "Sale") {
      sales += amount;
    }
  });

  return {
    income,
    expenses,
    sales,
    totalIncome: income + sales,
    profit: income + sales - expenses
  };
}

function renderDashboard(container) {
  const finance = calculateFinance();

  const livestock = getRecords("livestock");

  const totalAnimals = livestock.reduce((total, record) => {
    if (
      record.status === "Dead" ||
      record.status === "Sold"
    ) {
      return total;
    }

    return total + number(record.count);
  }, 0);

  const assets = getRecords("assets");

  const assetValue = assets.reduce((total, record) => {
    return total + number(record.value);
  }, 0);

  const crops = getRecords("crops");

  const cropArea = crops.reduce((total, record) => {
    return total + number(record.area);
  }, 0);

  const debts = getRecords("debts");

  const outstandingDebt = debts.reduce((total, record) => {
    return total + Math.max(
      0,
      number(record.amount) - number(record.paid)
    );
  }, 0);

  const recent = [
    ...getRecords("finance").map(record => ({
      ...record,
      module: "finance"
    })),
    ...getRecords("livestock").map(record => ({
      ...record,
      module: "livestock"
    })),
    ...getRecords("crops").map(record => ({
      ...record,
      module: "crops"
    }))
  ]
  .sort((a, b) => {
    return String(b.date || "").localeCompare(
      String(a.date || "")
    );
  })
  .slice(0, 8);

  container.innerHTML = `
    <div class="page-heading">
      <div>
        <h2>📊 Dashboard</h2>
        <div class="muted">
          Soo dhowow TACBO Agro Finance
        </div>
      </div>

      <button class="primary"
        onclick="openPage('finance')">
        + Diiwaan dhaqaale
      </button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Wadarta dakhliga</h3>
        <div class="number green">
          ${money(finance.totalIncome)}
        </div>
      </div>

      <div class="card">
        <h3>Wadarta kharashka</h3>
        <div class="number red">
          ${money(finance.expenses)}
        </div>
      </div>

      <div class="card">
        <h3>Faa'iidada / Khasaaraha</h3>
        <div class="number ${
          finance.profit >= 0 ? "green" : "red"
        }">
          ${money(finance.profit)}
        </div>
      </div>

      <div class="card">
        <h3>Tirada xoolaha nool</h3>
        <div class="number">${totalAnimals}</div>
      </div>

      <div class="card">
        <h3>Qiimaha hantida</h3>
        <div class="number blue">
          ${money(assetValue)}
        </div>
      </div>

      <div class="card">
        <h3>Baaxadda beeraha</h3>
        <div class="number">${cropArea} ha</div>
      </div>

      <div class="card">
        <h3>Deymaha harsan</h3>
        <div class="number red">
          ${money(outstandingDebt)}
        </div>
      </div>

      <div class="card">
        <h3>Tirada diiwaannada dhaqaale</h3>
        <div class="number">
          ${getRecords("finance").length}
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>⚡ Hawlaha degdegga ah</h3>

      <div class="actions">
        <button class="primary"
          onclick="openPage('finance')">
          💰 Diiwaan dhaqaale
        </button>

        <button class="secondary"
          onclick="openPage('livestock')">
          🐑 Ku dar xoolo
        </button>

        <button class="secondary"
          onclick="openPage('crops')">
          🌱 Ku dar dalag
        </button>

        <button class="secondary"
          onclick="openPage('milk')">
          🥛 Diiwaan caano
        </button>

        <button class="secondary"
          onclick="openPage('debts')">
          📒 Diiwaan deyn
        </button>
      </div>
    </div>

    <div class="panel">
      <h3>🕘 Diiwaannadii ugu dambeeyey</h3>

      ${
        recent.length
          ? `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Taariikh</th>
                    <th>Qaybta</th>
                    <th>Faahfaahin</th>
                    <th>Lacag</th>
                  </tr>
                </thead>

                <tbody>
                  ${recent.map(record => `
                    <tr>
                      <td>${escapeHTML(record.date || "-")}</td>

                      <td>
                        ${escapeHTML(
                          MODULES[record.module]?.title || ""

function renderField(field) {
  const [key, label, type] = field;
  const id = "field_" + key;

  if (type === "textarea") {
    return `
      <textarea
        id="${id}"
        name="${key}"
        placeholder="${escapeHTML(label)}"
      ></textarea>
    `;
  }

  if (type.startsWith("select:")) {
    const options = type.slice(7).split(";");

    return `
      <select id="${id}" name="${key}">
        <option value="">-- Dooro --</option>

        ${options.map(option => {
          const parts = option.split(",");

          return `
            <option value="${escapeHTML(parts[0])}">
              ${escapeHTML(parts[1] || parts[0])}
            </option>
          `;
        }).join("")}
      </select>
    `;
  }

  const inputType = type === "number" ? "number" : type;

  return `
    <input
      id="${id}"
      name="${key}"
      type="${inputType}"
      ${inputType === "number"
        ? 'min="0" step="any"'
        : ""}
      ${key === "date" ? 'value="' + today() + '"' : ""}
      placeholder="${escapeHTML(label)}"
    >
  `;
}

function resetModuleForm(moduleKey) {
  editingRecord = null;

  const form = document.getElementById("recordForm");

  if (form) {
    form.reset();

    const dateField = form.querySelector('[name="date"]');

    if (dateField) {
      dateField.value = today();
    }
  }

  const title = document.getElementById("formTitle");

  if (title) {
    title.textContent =
      "Ku dar " + MODULES[moduleKey].singular;
  }

  const cancelButton = document.getElementById("cancelEdit");

  if (cancelButton) {
    cancelButton.classList.add("hidden");
  }

  document.querySelectorAll(".field input").forEach(input => {
    input.setAttribute("autocomplete", "off");
  });
}

function saveRecord(event, moduleKey) {
  event.preventDefault();

  const form = event.target;
  const formData = new FormData(form);
  const record = {};

  for (const [key, value] of formData.entries()) {
    record[key] = value;
  }

  if (!record.date) {
    record.date = today();
  }

  const module = MODULES[moduleKey];

  const firstField = module.fields.find(field => {
    return field[0] !== "date";
  });

  if (
    firstField &&
    !String(record[firstField[0]] || "").trim()
  ) {
    showNotice(
      "Fadlan buuxi: " + firstField[1],
      true
    );

    return;
  }

  module.fields.forEach(field => {
    if (field[2] === "number") {
      record[field[0]] = number(record[field[0]]);
    }
  });

  const records = getRecords(moduleKey);

  if (editingRecord) {
    const index = records.findIndex(item => {
      return item.id === editingRecord;
    });

    if (index < 0) {
      showNotice("Diiwaanka lama helin.", true);
      return;
    }

    record.id = editingRecord;
    record.updatedAt = new Date().toISOString();

    records[index] = record;

    if (!saveDatabase()) return;

    showNotice("Xogta waa la beddelay.");
  } else {
    record.id = makeId();
    record.createdAt = new Date().toISOString();

    records.unshift(record);

    if (!saveDatabase()) {
      records.shift();
      return;
    }

    showNotice("Xogta si guul leh ayaa loo kaydiyey.");
  }

  renderPage();
}

function renderTable(moduleKey) {
  const module = MODULES[moduleKey];
  const records = getRecords(moduleKey);

  const filtered = records.filter(record => {
    if (!searchText) return true;

    const text = Object.values(record)
      .join(" ")
      .toLowerCase();

    return text.includes(searchText.toLowerCase());
  });

  if (!filtered.length) {
    return `
      <div class="empty">
        Wax xog ah lama helin.
      </div>
    `;
  }

  const columns = module.fields;

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            ${columns.map(field => `
              <th>${escapeHTML(field[1])}</th>
            `).join("")}
            <th>Ficil</th>
          </tr>
        </thead>

        <tbody>
          ${filtered.map(record => `
            <tr>
              ${columns.map(field => `
                <td>
                  ${formatCell(record, field)}
                </td>
              `).join("")}

              <td>
                <button class="small secondary"
                  onclick="editRecord('${moduleKey}','${record.id}')">
                  ✏️ Edit
                </button>

                <button class="small danger"
                  onclick="deleteRecord('${moduleKey}','${record.id}')">
                  🗑️ Delete
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function formatCell(record, field) {
  const key = field[0];
  const value = record[key];

  if (value === undefined || value === null || value === "") {
    return "-";
  }

  if (
    key.toLowerCase().includes("price") ||
    key === "amount" ||
    key === "cost" ||
    key === "revenue" ||
    key === "value" ||
    key === "salary" ||
    key === "paid" ||
    key === "unitCost"
  ) {
    return escapeHTML(money(value));
  }

  return escapeHTML(value);
}

function searchModule(moduleKey, value) {
  searchText = value || "";

  const table = document.getElementById("recordsTable");

  if (table) {
    table.innerHTML = renderTable(moduleKey);
  }
}

function editRecord(moduleKey, recordId) {

  if (!record) {

  editingRecord = recordId;

  const form = document.getElementById("recordForm");

  if (!form) {

  MODULES[moduleKey].fields.forEach(field => {

    }
  });

  const title = document.getElementById("formTitle");

  if (title) {
    title.textContent = "✏️ Wax ka beddel xogta";
  }

  const cancelButton = document.getElementById("cancelEdit");

}

/* =====================================================
   DELETE — TIRTIRIDDA XOGTA
===================================================== */

function deleteRecord(moduleKey, recordId) {
  const records = getRecords(moduleKey);

  const record = records.find(item => {
    return item.id === recordId;
  });

  if (!record) {
    showNotice("Diiwaanka lama helin.", true);
    return;
  }

  const confirmed = confirm(
    "Ma hubtaa inaad tirtirayso xogtan?\n\n" +
    "Ficilkan dib loogama noqon karo haddii aadan haysan backup."
  );

  if (!confirmed) return;

  const oldRecords = [...records];

  db.records[moduleKey] = records.filter(item => {
    return item.id !== recordId;
  });

  if (!saveDatabase()) {
    db.records[moduleKey] = oldRecords;
    return;
  }

  editingRecord = null;

  showNotice("Xogta waa la tirtiray.");

  renderPage();
}

function calculatorPress(value) {
  const display = document.getElementById("calcDisplay");

  if (!display) return;

  if (value === "=") {
    try {
      const expression = display.value;

      if (!expression || !/^[0-9+\-*/.() ]+$/.test(expression)) {
        display.value = "Qalad";
        return;
      }

      const result = Function(
        '"use strict"; return (' + expression + ')'
      )();

      display.value = Number.isFinite(result)
        ? String(result)
        : "Qalad";
    } catch {
      display.value = "Qalad";
    }

    return;
  }

  if (display.value === "Qalad") {
    display.value = "";
  }

  display.value += value;
}

function calculatorClear() {
  const display = document.getElementById("calcDisplay");

  if (display) display.value = "";
}

function calculatorBackspace() {
  const display = document.getElementById("calcDisplay");

  if (display) {
    display.value = display.value.slice(0, -1);
  }
}

function calculateProfit() {
  const income = number(
    document.getElementById("profitIncome")?.value
  );

  const expense = number(
    document.getElementById("profitExpense")?.value
  );

  const result = document.getElementById("profitResult");

  if (result) {
    result.value = money(income - expense);
  }
}

/* =========================
   BACKUP — KAYDINTA XOGTA
========================= */

function backupData() {
  try {
    const backup = {
      application: "TACBO Agro Finance",
      version: 1,
      exportedAt: new Date().toISOString(),
      data: db
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;

    link.download =
      "TACBO_Backup_" + today() + ".json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    showNotice("Backup-ka waa la soo dejiyey.");
  } catch (error) {
    console.error(error);

    showNotice(
      "Backup-ku wuu fashilmay.",
      true
    );
  }
}

/* =========================
   RESTORE — SOO CELINTA XOGTA
========================= */

function restoreData(event) {
  const file = event.target.files?.[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function () {
    try {
      const imported = JSON.parse(reader.result);

      const importedDB = imported.data || imported;

      if (
        !importedDB ||
        typeof importedDB !== "object" ||
        !importedDB.records
      ) {
        throw new Error("Faylka backup-ku ma saxna.");
      }

      const confirmed = confirm(
        "Ma rabtaa inaad soo celiso xogta backup-kan?\n\n" +
        "Xogta hadda ku jirta app-ka waxaa beddeli kara xogta backup-ka."
      );

      if (!confirmed) {
        event.target.value = "";
        return;
      }

      const newRecords = {};

      Object.keys(MODULES).forEach(key => {
        const list = importedDB.records[key];

        newRecords[key] = Array.isArray(list)
          ? list
          : [];
      });

      db = {
        version: 1,
        records: newRecords,
        settings: {
          ...(importedDB.settings || {})
        }
      };

      if (!saveDatabase()) {
        showNotice(
          "Xogta lama soo celin karin.",
          true
        );

        event.target.value = "";
        return;
      }

      editingRecord = null;
      searchText = "";

      renderPage();

      showNotice("Backup-ka si guul leh ayaa loo soo celiyey.");
    } catch (error) {
      console.error(error);

      showNotice(
        "Faylka backup-ku ma saxna ama lama akhrin karo.",
        true
      );
    }

    event.target.value = "";
  };

  reader.onerror = function () {
    showNotice(
      "Faylka lama akhrin karin.",
      true
    );

    event.target.value = "";
  };

  reader.readAsText(file);
}

/* =========================
   EXPORT — CSV
========================= */

function downloadCSV(filename, rows) {
  if (!rows.length) {
    showNotice("Ma jiraan xog la dhoofin karo.", true);
    return;
  }

  const csv = rows.map(row => {
    return row.map(value => {
      let text = String(value ?? "");

      if (/^[=+\-@]/.test(text)) {
        text = "'" + text;
      }

      return '"' + text.replaceAll('"', '""') + '"';
    }).join(",");
  }).join("\r\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showNotice("Faylka CSV waa la soo dejiyey.");
}

function exportModuleCSV(moduleKey) {
  const module = MODULES[moduleKey];

  if (!module) {
    showNotice("Qaybta lama helin.", true);
    return;
  }

  const fields = module.fields;

  const rows = [
    fields.map(field => field[1]),
    ...getRecords(moduleKey).map(record => {
      return fields.map(field => record[field[0]] ?? "");
    })
  ];

  downloadCSV(
    "TACBO_" + moduleKey + "_" + today() + ".csv",
    rows
  );
}

function exportAllCSV() {
  const rows = [
    ["Qaybta", "ID", "Taariikh", "Faahfaahin", "Lacag"]
  ];

  Object.keys(MODULES).forEach(moduleKey => {
    getRecords(moduleKey).forEach(record => {
      rows.push([
        MODULES[moduleKey].title,
        record.id || "",
        record.date || "",
        record.category ||
          record.name ||
          record.crop ||
          record.animalType ||
          record.person ||
          "",
        record.amount ??
          record.revenue ??
          record.salePrice ??
          record.cost ??
          record.value ??
          ""
      ]);
    });
  });

  downloadCSV(
    "TACBO_All_Records_" + today() + ".csv",
    rows
  );
}

/* Wadarta ilmaha dhashay */
function getTotalBorn() {
  return breedingRecords.reduce((total, record) => {
    return total + number(record.born);
  }, 0);
}

/* Wadarta ilmaha nool */
function getTotalAliveBabies() {
  return breedingRecords.reduce((total, record) => {
    return total + number(record.alive);
  }, 0);
}

/* Wadarta ilmaha dhintay */
function getTotalDeadBabies() {
  return breedingRecords.reduce((total, record) => {
    return total + number(record.dead);
  }, 0);
}

/* Kaydi dhalashada cusub */
function saveBreedingRecord(event) {
  event.preventDefault();

  const form = event.target;
  const data = new FormData(form);
  const record = {};

  for (const [key, value] of data.entries()) {
    record[key] = value;
  }

  record.id = makeId();
  record.born = number(record.born);
  record.alive = number(record.alive);
  record.dead = number(record.dead);
  record.cost = number(record.cost);

  if (record.alive + record.dead !== record.born) {
    showNotice(
      "Tirada ilmaha nool iyo kuwa dhintay waa inay la mid noqotaa wadarta ilmaha dhashay.",
      true
    );

    return;
  }

  record.createdAt = new Date().toISOString();

  breedingRecords.unshift(record);

  if (!saveBreedingRecords()) {
    breedingRecords.shift();
    return;
  }

  /*
    Haddii xoolaha hooyada lagu diiwaangeliyey
    qaybta xoolaha, tirada ilmaha waa la kordhin karaa.
    Si looga fogaado tirin laba jeer ah, qaybtaan
    si toos ah uma kordhinayso tirada xoolaha.
  */

  showNotice("Dhalashada waa la kaydiyey.");

  openBreedingPage();
}

/* Tus diiwaannada dhalashada */
function renderBreedingTable() {
  const table = document.getElementById("breedingTable");

  if (!table) return;

  const query = (
    document.getElementById("breedingSearch")?.value || ""
  ).toLowerCase();

  const records = breedingRecords.filter(record => {
    return Object.values(record)
      .join(" ")
      .toLowerCase()
      .includes(query);
  });

  if (!records.length) {
    table.innerHTML = `
      <div class="empty">
        Weli dhalasho lama diiwaangelin.
      </div>
    `;

    return;
  }

  table.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Taariikh</th>
            <th>Nooca</th>
            <th>Hooyada</th>
            <th>Aabbaha</th>
            <th>Dhashay</th>
            <th>Nool</th>
            <th>Dhintay</th>
            <th>Xaaladda hooyada</th>
            <th>Kharash</th>
            <th>Ficil</th>
          </tr>
        </thead>

        <tbody>
          ${records.map(record => `
            <tr>
              <td>${escapeHTML(record.date || "-")}</td>
              <td>${escapeHTML(record.animalType || "-")}</td>
              <td>${escapeHTML(record.motherId || "-")}</td>
              <td>${escapeHTML(record.fatherId || "-")}</td>
              <td>${number(record.born)}</td>

          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* Tirtir diiwaanka dhalashada */
function deleteBreedingRecord(id) {
  if (!confirm("Ma hubtaa inaad tirtirayso diiwaankan?")) {
    return;
  }

  const previous = [...breedingRecords];

  breedingRecords = breedingRecords.filter(record => {
    return record.id !== id;
  });

  if (!saveBreedingRecords()) {
    breedingRecords = previous;
    return;
  }

  openBreedingPage();

  showNotice("Diiwaanka dhalashada waa la tirtiray.");
}
