<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TACBO Finance & Farm</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #17231b;
    }

    header {
      background: #dff1e3;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #536158;
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tab {
      border: 0;
      padding: 14px 18px;
      border-radius: 16px;
      background: #edf2ee;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
    }

    .tab.active {
      background: #1d7a3d;
      color: white;
    }

    .page {
      display: none;
      padding: 18px;
      max-width: 800px;
      margin: auto;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      font-size: 27px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      margin: 18px 0 8px;
    }

    input,
    select {
      width: 100%;
      padding: 17px;
      border: 2px solid #d7e0d9;
      border-radius: 18px;
      font-size: 17px;
      background: white;
    }

    .save {
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: 0;
      border-radius: 18px;
      background: #1d7a3d;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .save:active {
      transform: scale(.98);
    }

    .item {
      border: 1px solid #dce5df;
      border-radius: 20px;
      padding: 18px;
      margin-top: 14px;
      background: #fbfdfb;
    }

    .item h3 {
      margin: 0 0 12px;
      font-size: 21px;
    }

    .item p {
      margin: 8px 0;
    }

    .delete {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 15px;
      background: #ffe5e5;
      color: #a40000;
      font-weight: bold;
      font-size: 16px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      display: none;
    }

    .success {
      display: block;
      background: #e2f6e7;
      color: #17652d;
    }

    .error {
      display: block;
      background: #ffe4e4;
      color: #a00000;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #68746d;
    }
  </style>
</head>

<body>

<header>
  <h1>🌾 TACBO Finance & Farm</h1>
  <p>Maamulka Xoolaha & Beeraha</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('animals', this)">
    🐑 Maamulka Xoolaha
  </button>

  <button class="tab" onclick="showPage('farms', this)">
    🌾 Maamulka Beeraha
  </button>
</div>


<!-- ========================= -->
<!-- MAAMULKA XOOLAHA -->
<!-- ========================= -->

<section id="animals" class="page active">

  <div class="card">

    <h2>🐑🐄 Maamulka Xoolaha</h2>

    <label>Nooca xoolaha</label>

    <select id="animalType">
      <option value="">Dooro nooca</option>
      <option value="Ari">🐑 Ari</option>
      <option value="Lo">🐄 Lo</option>
      <option value="Geel">🐪 Geel</option>
      <option value="Digaag">🐔 Digaag</option>
    </select>


    <label>Tirada hadda jirta</label>

    <input
      id="animalCount"
      type="number"
      min="0"
      placeholder="Tusaale: 300"
    >


    <label>🍼 Dhashay</label>

    <input
      id="animalBorn"
      type="number"
      min="0"
      value="0"
    >


    <label>💀 Dhintay</label>

    <input
      id="animalDead"
      type="number"
      min="0"
      value="0"
    >


    <label>🛒 La iibiyey</label>

    <input
      id="animalSold"
      type="number"
      min="0"
      value="0"
    >


    <label>💵 Qiimaha hal neef ($)</label>

    <input
      id="animalPrice"
      type="number"
      min="0"
      placeholder="Tusaale: 60"
    >


    <label>📅 Taariikhda</label>

    <input
      id="animalDate"
      type="date"
    >


    <button class="save" onclick="saveAnimal()">
      ➕ Ku dar Xoolo
    </button>

    <div id="animalMessage" class="message"></div>

  </div>


  <div class="card">

    <h2>📋 Diiwaanka Xoolaha</h2>

    <div id="animalsList">
      ⏳ Xogta waa la soo gelinayaa...
    </div>

  </div>

</section>



<!-- ========================= -->
<!-- MAAMULKA BEERAHA -->
<!-- ========================= -->

<section id="farms" class="page">

  <div class="card">

    <h2>🌾 Maamulka Beeraha</h2>


    <label>Nooca dalagga</label>

    <select id="cropType">

      <option value="">Dooro dalagga</option>

      <option value="Galley">
        🌽 Galley
      </option>

      <option value="Masaggo">
        🌾 Masaggo
      </option>

      <option value="Sisinta">
        🌱 Sisinta
      </option>

      <option value="Yaanyo">
        🍅 Yaanyo
      </option>

      <option value="Basal">
        🧅 Basal
      </option>

      <option value="Toon">
        🧄 Toon
      </option>

      <option value="Khudaar">
        🥬 Khudaar
      </option>

    </select>


    <label>📏 Baaxadda beerta (Hektar)</label>

    <input
      id="farmArea"
      type="number"
      min="0"
      placeholder="Tusaale: 20"
    >


    <label>🌱 La beeray</label>

    <input
      id="planted"
      type="number"
      min="0"
      placeholder="Tusaale: 20"
    >


    <label>🌾 La goostay</label>

    <input
      id="harvested"
      type="number"
      min="0"
      placeholder="Tusaale: 15"
    >


    <label>🛒 La iibiyey</label>

    <input
      id="farmSold"
      type="number"
      min="0"
      placeholder="Tusaale: 10"
    >


    <label>💵 Qiimaha ($)</label>

    <input
      id="farmPrice"
      type="number"
      min="0"
      placeholder="Tusaale: 500"
    >


    <label>📅 Taariikhda</label>

    <input
      id="farmDate"
      type="date"
    >


    <button class="save" onclick="saveFarm()">
      ➕ Ku dar Beer
    </button>

    <div id="farmMessage" class="message"></div>

  </div>


  <div class="card">

    <h2>📋 Diiwaanka Beeraha</h2>

    <div id="farmsList">
      ⏳ Xogta waa la soo gelinayaa...
    </div>

  </div>

</section>



<script>

  /* ==================================
     SUPABASE
     ================================== */

  const SUPABASE_URL = "GELI_SUPABASE_URL_KAAGA_HALKAN";

  const SUPABASE_ANON_KEY = "GELI_SUPABASE_ANON_KEY_KAAGA_HALKAN";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================
     TAARIIKHDA MAANTA
     ================================== */

  const today =
    new Date().toISOString().split("T")[0];

  document.getElementById("animalDate").value = today;
  document.getElementById("farmDate").value = today;


  /* ==================================
     TAB NAVIGATION
     ================================== */

  function showPage(pageId, button) {

    document.querySelectorAll(".page")
      .forEach(page => page.classList.remove("active"));

    document.querySelectorAll(".tab")
      .forEach(tab => tab.classList.remove("active"));

    document.getElementById(pageId)
      .classList.add("active");

    button.classList.add("active");

  }


  /* ==================================
     MESSAGE
     ================================== */

  function showMessage(id, text, type) {

    const box = document.getElementById(id);

    box.textContent = text;

    box.className = "message " + type;

    setTimeout(() => {
      box.className = "message";
    }, 4000);

  }


  /* ==================================
     XOOLAHA - SAVE
     ================================== */

  async function saveAnimal() {

    const animal_type =
      document.getElementById("animalType").value;

    const count =
      Number(document.getElementById("animalCount").value) || 0;

    const born =
      Number(document.getElementById("animalBorn").value) || 0;

    const dead =
      Number(document.getElementById("animalDead").value) || 0;

    const sold =
      Number(document.getElementById("animalSold").value) || 0;

    const price =
      Number(document.getElementById("animalPrice").value) || 0;

    const date =
      document.getElementById("animalDate").value;


    if (!animal_type) {

      showMessage(
        "animalMessage",
        "❌ Fadlan dooro nooca xoolaha",
        "error"
      );

      return;
    }


    if (count < 0) {

      showMessage(
        "animalMessage",
        "❌ Tiradu ma noqon karto negative",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("livestock")
        .insert({

          animal_type: animal_type,

          count: count,

          born: born,

          dead: dead,

          sold: sold,

          price: price,

          date: date || today

        });


    if (error) {

      console.error(error);

      showMessage(
        "animalMessage",
        "❌ Xogta xoolaha lama kaydin: " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      "animalMessage",
      "✅ Xogta xoolaha waa la kaydiyey",
      "success"
    );


    document.getElementById("animalType").value = "";
    document.getElementById("animalCount").value = "";
    document.getElementById("animalBorn").value = 0;
    document.getElementById("animalDead").value = 0;
    document.getElementById("animalSold").value = 0;
    document.getElementById("animalPrice").value = "";


    loadAnimals();

  }



  /* ==================================
     XOOLAHA - LOAD
     ================================== */

  async function loadAnimals() {

    const list =
      document.getElementById("animalsList");

    list.innerHTML =
      "⏳ Xogta waa la soo gelinayaa...";


    const { data, error } =
      await supabaseClient
        .from("livestock")
        .select("*")
        .order("date", { ascending: false });


    if (error) {

      console.error(error);

      list.innerHTML =
        "❌ Xogta xoolaha lama soo gelin.";

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">📭 Weli xog xoolo ah lama hayo.</div>';

      return;
    }


    list.innerHTML =
      data.map(item => `

        <div class="item">

          <h3>
            ${animalIcon(item.animal_type)}
            ${item.animal_type}
          </h3>

          <p>
            Tirada hadda:
            <strong>${item.count ?? 0}</strong>
          </p>

          <p>
            🍼 Dhashay:
            <strong>${item.born ?? 0}</strong>
          </p>

          <p>
            💀 Dhintay:
            <strong>${item.dead ?? 0}</strong>
          </p>

          <p>
            🛒 La iibiyey:
            <strong>${item.sold ?? 0}</strong>
          </p>

          <p>
            💵 Qiime:
            <strong>$${item.price ?? 0}</strong>
          </p>

          <p>
            📅 Taariikh:
            <strong>${item.date ?? ""}</strong>
          </p>

          <button
            class="delete"
            onclick="deleteAnimal(${item.id})"
          >
            🗑️ Tirtir
          </button>

        </div>

      `).join("");

  }



  function animalIcon(type) {

    if (type === "Ari") return "🐑";

    if (type === "Lo") return "🐄";

    if (type === "Geel") return "🐪";

    if (type === "Digaag") return "🐔";

    return "🐾";

  }



  /* ==================================
     XOOLAHA - DELETE
     ================================== */

  async function deleteAnimal(id) {

    if (!confirm(
      "Ma hubtaa inaad rabto inaad tirtirto xogtan?"
    )) return;


    const { error } =
      await supabaseClient
        .from("livestock")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "❌ Xogta xoolaha lama tirtirin: " +
        error.message
      );

      return;
    }


    alert("✅ Xogta waa la tirtiray");

    loadAnimals();

  }



  /* ==================================
     BEERAHA - SAVE
     ================================== */

  async function saveFarm() {

    const crop_type =
      document.getElementById("cropType").value;

    const area =
      Number(document.getElementById("farmArea").value) || 0;

    const planted =
      Number(document.getElementById("planted").value) || 0;

    const harvested =
      Number(document.getElementById("harvested").value) || 0;

    const sold =
      Number(document.getElementById("farmSold").value) || 0;

    const price =
      Number(document.getElementById("farmPrice").value) || 0;

    const date =
      document.getElementById("farmDate").value;


    if (!crop_type) {

      showMessage(
        "farmMessage",
        "❌ Fadlan dooro nooca dalagga",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("farms")
        .insert({

          crop_type: crop_type,

          area: area,

          planted: planted,

          harvested: harvested,

          sold: sold,

          price: price,

          date: date || today

        });


    if (error) {

      console.error(error);

      showMessage(
        "farmMessage",
        "❌ Xogta beerta lama kaydin: " +
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "farmMessage",
      "✅ Xogta beerta waa la kaydiyey",
      "success"
    );


    document.getElementById("cropType").value = "";
    document.getElementById("farmArea").value = "";
    document.getElementById("planted").value = "";
    document.getElementById("harvested").value = "";
    document.getElementById("farmSold").value = "";
    document.getElementById("farmPrice").value = "";


    loadFarms();

  }



  /* ==================================
     BEERAHA - LOAD
     ================================== */

  async function loadFarms() {

    const list =
      document.getElementById("farmsList");

    list.innerHTML =
      "⏳ Xogta beeraha waa la soo gelinayaa...";


    const { data, error } =
      await supabaseClient
        .from("farms")
        .select("*")
        .order("date", { ascending: false });


    if (error) {

      console.error(error);

      list.innerHTML =
        "❌ Xogta beeraha lama soo gelin.";

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">📭 Weli xog beer ah lama hayo.</div>';

      return;
    }


    list.innerHTML =
      data.map(item => `

        <div class="item">

          <h3>
            🌾 ${item.crop_type}
          </h3>

          <p>
            📏 Baaxad:
            <strong>${item.area ?? 0}</strong>
            hektar
          </p>

          <p>
            🌱 La beeray:
            <strong>${item.planted ?? 0}</strong>
          </p>

          <p>
            🌾 La goostay:
            <strong>${item.harvested ?? 0}</strong>
          </p>

          <p>
            🛒 La iibiyey:
            <strong>${item.sold ?? 0}</strong>
          </p>

          <p>
            💵 Qiime:
            <strong>$${item.price ?? 0}</strong>
          </p>

          <p>
            📅 Taariikh:
            <strong>${item.date ?? ""}</strong>
          </p>

          <button
            class="delete"
            onclick="deleteFarm(${item.id})"
          >
            🗑️ Tirtir
          </button>

        </div>

      `).join("");

  }



  /* ==================================
     BEERAHA - DELETE
     ================================== */

  async function deleteFarm(id) {

    if (!confirm(
      "Ma hubtaa inaad rabto inaad tirtirto xogtan beerta?"
    )) return;


    const { error } =
      await supabaseClient
        .from("farms")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "❌ Xogta beerta lama tirtirin: " +
        error.message
      );

      return;
    }


    alert("✅ Xogta beerta waa la tirtiray");

    loadFarms();

  }



  /* ==================================
     APP START
     ================================== */

  loadAnimals();
  loadFarms();

</script>

</body>
</html>
