function esc(x){
return String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}


function money(x){
return Number(x||0).toLocaleString()+" "+D.settings.currency;
}


function save(){
localStorage.setItem(KEY,JSON.stringify(D));
render(current);
}


function today(){
return new Date().toISOString().slice(0,10);
}


let current="dashboard";


function show(id,b){

current=id;

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

render(id);

}


function del(a,i){

function field(id,label,type="text"){

`).join("")}

function addSale(){

let q=+sq.value||0;
let p=+sp.value||0;

if(!q||!p){
alert("Quantity iyo Qiime geli");
return;
}

let x={
date:today(),
type:st.value,
desc:sd.value,
qty:q,
price:p,
total:q*p,
pay:sPay.value
};


if(st.value==="Xoolo"){

let type=sat.value;

let available=D.animals
.filter(a=>a.type===type)
.reduce((s,a)=>s+a.qty,0);

if(available<q){
alert("Tirada xoolaha kuma filna");
return;
}

let left=q;

D.animals.forEach(a=>{

if(a.type===type&&left>0){

let take=Math.min(a.qty,left);

a.qty-=take;

left-=take;

}

});

x.animal=type;

}


D.sales.push(x);


if(sPay.value==="Credit"){

D.debts.push({

name:sd.value||"Customer",
phone:"",
type:"Lagu leeyahay",
total:q*p,
paid:0,
due:"",
fromSale:true

});

}


save();

}

/* ================= BACKUP ================= */

function backup(){

let blob=new Blob(

[JSON.stringify(D,null,2)],

{type:"application/json"}

);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="TACBO-Agro-Backup.json";

a.click();

}


/* ================= RESTORE ================= */

function restoreData(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=()=>{

try{

D=JSON.parse(reader.result);

save();

alert("Backup waa la soo celiyay ✅");

}catch(error){

alert("Backup-ka ma saxna ❌");

}

};

reader.readAsText(file);

}


/* ================= CSV ================= */

function exportCSV(){

let rows=[
["Date","Type","Description","Quantity","Price","Total","Payment"]
];

D.sales.forEach(x=>{

rows.push([
x.date,
x.type,
x.desc,
x.qty,
x.price,
x.total,
x.pay
]);

});

let csv=rows.map(row=>

row.map(value=>
`"${String(value??"").replace(/"/g,'""')}"`
).join(",")

).join("\n");

let blob=new Blob([csv],{type:"text/csv"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="TACBO-Sales.csv";

a.click();

}
